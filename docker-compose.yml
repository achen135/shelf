# Shelf local infra.
#
#   docker compose up -d postgres            just the database (M0; `make up`)
#   docker compose up --scale worker=4       the whole crawler: postgres, migrate, coordinator, 4 workers
#   docker kill shelf-worker-2               watch the coordinator reap its lease and another worker take the page
#   docker kill $(docker compose ps -q coordinator | head -1)   ...or kill the leader
#
# Every service but postgres is the same image running a different `shelf` subcommand. M6 adds
# `api` on :8080.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
    ports:
      - "5432:5432"
    volumes:
      - shelf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the Flyway migrations, then exits. The crawler services wait for it.
  # All three shelf services name the same image, so one build serves them all.
  migrate:
    image: shelf:local
    build: .
    command: ["migrate"]
    environment: &shelf_env
      SHELF_DB_URL: jdbc:postgresql://postgres:5432/shelf
      SHELF_DB_USER: shelf
      SHELF_DB_PASSWORD: shelf
    depends_on:
      postgres:
        condition: service_healthy

  # The leader-elected scheduler. `deploy.replicas: 2` gives a standby; only one holds the lock.
  coordinator:
    image: shelf:local
    build: .
    command: ["coordinator", "--category", "keyboards"]
    environment: *shelf_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    restart: unless-stopped

  # The worker pool. Scale it: `docker compose up --scale worker=N`.
  worker:
    image: shelf:local
    build: .
    command: ["worker"]
    environment: *shelf_env
    volumes:
      - shelf_raw:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # TODO(M6): api service exposing 8080.

volumes:
  shelf_pgdata:
  shelf_raw:
