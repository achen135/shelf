# Shelf category config — computer monitors (M7, the second category).
# Same shape as keyboards.yaml: a spec schema, retailers with a per-retailer fetch strategy, a
# resolution section, a seed product list. The pipeline learned about this category from this
# file and one `SpecExtractor` implementation; nothing in the crawl, resolution, rollup, signal
# or API code changed (docs/benchmarks/m7-onboard-monitors.md has the diff stat).
#
# Retailer selection (verified 2026-09-16, survey in docs/Sessions.md M7): every retailer below
# is a Shopify storefront whose public product JSON robots.txt permits — the same outcome as the
# M0 keyboard survey. Rejected: sceptre.com (OpenCart, server-rendered, robots-open — but it
# lists MSRPs beside "buy at your e-tailers" links and has no cart, so its price is a list price,
# not a sold one); us.aoc.com (redirect loop on the storefront JSON); antonline.com,
# monoprice.com, msi.com (403 to a plain crawler); abt.com (Cloudflare challenge); lg.com,
# dell.com, samsung.com, viewsonic.com (client-rendered prices); ktcgaming.com, titanarmy.com,
# store.viewsonic.com (unreachable from here). Portable-only brands (Arzopa, Uperfect, Mobile
# Pixels) were left out to keep the category desk monitors.

name: monitors

# --- spec schema ---------------------------------------------------------------
# Field -> {type, enum?, unit?}. Validated against every listing's extracted spec and every
# API filter. The enum fields are what the demo page turns into selects; the numbers are
# filterable through the API (`refresh_hz=240`) and shown in the row.
spec_schema:
  panel_type:   { type: string,  enum: [ips, va, tn, oled, qd-oled, mini-led] }
  resolution:   { type: string,  enum: ["1080p", "1440p", "4k", "5k", "6k", ultrawide-1080p, ultrawide-1440p, ultrawide-5k2k, dual-1440p, dual-4k] }
  aspect_ratio: { type: string,  enum: ["16:9", "16:10", "21:9", "32:9"] }
  refresh_hz:   { type: integer, unit: hz }
  size_in:      { type: number,  unit: in }
  curved:       { type: boolean }
  hdr:          { type: string,  enum: [hdr10, hdr400, hdr500, hdr600, hdr1000, hdr1400, true-black-400, true-black-500] }
  usb_c:        { type: boolean }
  speakers:     { type: boolean }

# --- entity resolution ---------------------------------------------------------
resolution:
  # Every variant of one monitor shares its panel size — a Spectrum Black 27 and a Spectrum
  # Black 32 are different products, and Pixio's colourways of a PX277 are all 27". Measured on
  # the label set with it on and off (docs/benchmarks/m7-onboard-monitors.md): identical
  # numbers either way — no labeled pair conflicts on size that the model tokens had not already
  # decided — so it is on for the reasoning, not for a measured gain. Contrast keyboards, where
  # layout_size cost four matches and is off.
  identity_fields: [size_in]
  # Used / open-box / refurbished stock is sold under the new product's title at these
  # retailers (Focus Camera's "Used Department", Pixio's "Certified Refurbished", Dough's
  # "B-Stock"); their prices are real but they are not the product's price. Bundles and
  # multi-packs likewise. "mouse" and "expansion hub" were added after the first eval pass: the
  # two false positives were a Dell P2425H "with Gaming Mouse and Extended Mouse Pad" and one
  # "with 3-Port USB-C Portable Expansion Hub" — bundles that never say "bundle". "stand" and
  # "arm" are deliberately absent: "with Adjustable Stand" is in a third of the real titles, and
  # "USB-C Hub Monitor" is a monitor.
  non_product_phrases: ["used", "open box", "refurbished", "renewed", "b stock", "bundle", "combo", "2 pack", "3 items", "monitor arm", "desk arm", "mouse", "expansion hub"]

# --- retailers ---------------------------------------------------------------
retailers:
  - name: focuscamera
    base_url: "https://www.focuscamera.com"
    brand_source: vendor         # genuine multi-brand retailer: Dell, LG, Samsung, BenQ, Asus…
    fetch:
      mode: api
      list_paths:
        - "/collections/monitors/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2               # 246 listings on 2026-09-16
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      The cross-retailer anchor for this category, and the one place the config format shows a
      seam: about half of its `vendor` values are the distributor the stock came through ("Nine
      Trading LLC", "New Age Electronics (Synnex)") or "Used Department", not the manufacturer,
      and `brand_source` offers only `vendor` or `fixed`. Those listings are crawled and priced
      but block under the distributor's name and never reach a product; the count is in the M7
      benchmark. A `brand_source: title` would be the fix and is deliberately not in this pass.

  - name: pixio
    base_url: "https://www.pixiogaming.com"
    brand_source: fixed
    brand: Pixio
    fetch:
      mode: api
      list_paths:
        - "/collections/monitors/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1               # 34 products / 140 colour variants
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      The richest tags of the set: every listing carries its resolution ("1440p"), refresh
      ("180Hz"), size ("27") and panel ("FAST IPS", "Fast VA", "OLED") as separate tags.
      Refurbished and open-box stock is listed as its own product under the same model name.

  - name: dough
    base_url: "https://dough.tech"
    brand_source: fixed          # `vendor` is "Dough" on some listings and "doughtechglobal" on others
    brand: Dough
    fetch:
      mode: api
      list_paths:
        - "/collections/spectrum-gaming-monitors/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      No tags and no product_type, so every spec comes from the title. Variants are the panel
      finish (matte / glossy / Gorilla Glass) and hub, priced apart.

  - name: koorui
    base_url: "https://www.koorui.net"
    brand_source: fixed
    brand: KOORUI
    fetch:
      mode: api
      list_paths:
        - "/collections/gaming-monitors/products.json?limit={limit}&page={page}"
        - "/collections/business-monitor/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      Every listing was `available: false` on 2026-09-16 — the storefront shows prices and
      sends buyers to Amazon — so it contributes prices but no in-stock signal until that changes.

  - name: innocn
    base_url: "https://innocn.com"
    brand_source: fixed
    brand: INNOCN
    fetch:
      mode: api
      list_paths:
        - "/en-us/collections/brand-new/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      A localized storefront: the collection lives under /en-us/ and www redirects there. Titles
      are "INNOCN | 27" 4K 120Hz IPS HDR500 Professional Monitor | CB27U1" — the model last.
      The same collection lists "×2 + Monitor Arm Combo" bundles, hence `combo`.

  - name: coolermaster
    base_url: "https://store.coolermaster.com"
    brand_source: fixed          # `vendor` is "Cooler Master North America"
    brand: Cooler Master
    fetch:
      mode: api
      list_paths:
        - "/collections/monitors/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      Six listings, all out of stock on 2026-09-16, titled by bare model ("Tempest GP27U") with
      product_type "Accessories" and no tags. Kept because Focus Camera stocks the same brand,
      which makes it the category's one direct cross-retailer pair.

# --- communities -----------------------------------------------------------------
# Where people talk about monitors (M8). Same rules and the same live-checked platform findings as
# the keyboards file: Reddit entries wait on an approved Data API client; YouTube entries read
# uploads + top-level comments with a plain API key, no transcripts, 30-day retention.
communities:
  - name: r_monitors
    source: reddit
    id: Monitors
    enabled: false
    ingest:
      window_days: 30
      max_items: 200
      comments_per_item: 50
      max_rps: 1.0
      auth:
        mode: oauth2_client_credentials
        env_vars: ["REDDIT_CLIENT_ID", "REDDIT_CLIENT_SECRET"]
    notes: TODO(M8+) — waits on Reddit's Responsible Builder Policy approval; see keyboards.yaml.

  - name: yt_monitors_unboxed
    source: youtube
    id: "@MonitorsUnboxed"
    ingest:
      window_days: 90
      max_items: 50
      comments_per_item: 100
      max_rps: 1.0
      auth:
        mode: api_key
        env_vars: ["YOUTUBE_API_KEY"]
    notes: Monitors Unboxed (Hardware Unboxed's monitor channel); handle checked 2026-09-17.

  - name: yt_rtings
    source: youtube
    id: "@RtingsDotCom"
    ingest:
      window_days: 90
      max_items: 50
      comments_per_item: 100
      max_rps: 1.0
      auth:
        mode: api_key
        env_vars: ["YOUTUBE_API_KEY"]
    notes: RTINGS — monitor (and other) reviews; handle checked 2026-09-17.

