# Shelf category config — mechanical keyboards.
# A category is defined entirely here: its spec schema, its retailers + how to fetch each,
# and a seed product list to bootstrap the catalog. Adding a category = a file like this
# plus parsers; no pipeline code changes (proven in M7 with monitors).
#
# Retailer selection (verified 2026-09-10, see docs/Sessions.md M0 for the full survey):
# every retailer below is fetched from its Shopify storefront's public product JSON, which
# robots.txt permits and which returns price, availability, SKU and variants as structured
# data. HTML-only candidates were evaluated and rejected: zsa.io renders prices client-side,
# nuphy.com and microcenter.com answer bot challenges, drop.com serves no robots.txt, and
# bhphotovideo.com 403s a plain crawler. Best Buy and eBay have real APIs but need
# credentials, so they are present and disabled rather than guessed at.

name: keyboards

# --- spec schema ---------------------------------------------------------------
# Field -> {type, enum?, unit?}. The app validates products.spec against this.
spec_schema:
  switch_type:     { type: string,  enum: [linear, tactile, clicky, silent-linear, silent-tactile, magnetic, topre, optical] }
  hot_swap:        { type: boolean }
  layout_size:     { type: string,  enum: ["full", "1800", "tkl", "75", "65", "60", "40", "alice", "split"] }
  connectivity:    { type: string,  enum: [wired, "2.4ghz", bluetooth, tri-mode] }
  keycap_profile:  { type: string,  enum: [oem, cherry, sa, xda, dsa, mt3, kat] }
  keycap_material: { type: string,  enum: [abs, pbt, unknown] }
  case_material:   { type: string,  enum: [plastic, aluminum, polycarbonate, wood, other] }
  mount_type:      { type: string,  enum: [tray, top, gasket, "o-ring", plate, unknown] }
  key_count:       { type: integer }

# --- retailers ---------------------------------------------------------------
# `mode: api` = a structured endpoint parsed with Jackson. `mode: html` = a public page parsed
# with Jsoup. list_paths are the ONLY paths fetched for a retailer: the crawler never follows a
# link out of a fetched document. {limit}/{page} are substituted per request.
retailers:
  - name: keychron
    base_url: "https://www.keychron.com"
    brand_source: fixed          # Shopify `vendor` here is a product series ("Q HE series")
    brand: Keychron
    fetch:
      mode: api
      list_paths:
        - "/collections/all-keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2               # ~352 keyboards in this collection
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      Shopify storefront product JSON. robots.txt allows /collections and /products; the
      disallowed paths are cart/checkout/account, which this crawler never requests.

  - name: kbdfans
    base_url: "https://kbdfans.com"
    brand_source: fixed          # `vendor` is "KBDfans", plus a few listings tagged "Third Party"
    brand: KBDfans
    fetch:
      mode: api
      list_paths:
        - "/collections/keyboard-category/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      A handful of listings carry vendor "Third Party" rather than a manufacturer; those keep
      the store brand here and are left for M3 entity resolution to correct from the title.

  - name: mechanicalkeyboards
    base_url: "https://mechanicalkeyboards.com"
    brand_source: vendor         # genuine multi-brand retailer: Ducky, Varmilo, HHKB, Leopold…
    fetch:
      mode: api
      list_paths:
        - "/collections/compact-keyboards-60/products.json?limit={limit}&page={page}"
        - "/collections/75-keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      The cross-retailer anchor: stocks brands that also sell direct (Keychron, Wooting,
      Glorious), which is what makes a price comparison — and M3's resolution eval — meaningful.

  - name: glorious
    base_url: "https://www.gloriousgaming.com"
    brand_source: fixed          # `vendor` is a series ("GMMK 3 Prebuilt")
    brand: Glorious
    fetch:
      mode: api
      list_paths:
        - "/collections/keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json

  - name: epomaker
    base_url: "https://epomaker.com"
    brand_source: vendor         # accurate here: "Epomaker", and "AJAZZ" for the one rebadge
    fetch:
      mode: api
      list_paths:
        - "/collections/keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json

  # --- configured but not yet crawlable ------------------------------------------
  # Both are real APIs with public documentation, disabled until credentials exist. The
  # endpoint/param details are deliberately NOT filled in from memory — see docs/Sessions.md.
  - name: bestbuy
    base_url: "https://api.bestbuy.com"
    enabled: false
    brand_source: vendor
    fetch:
      mode: api
      list_paths:
        - "/v1/products(categoryPath.id={category_path_id})?format=json&pageSize={limit}&page={page}"
      page_size: 100
      max_pages: 2
      max_rps: 1.0
      respect_robots: true
      auth:
        mode: api_key
        env_vars: ["BESTBUY_API_KEY"]
    parser: bestbuy_api
    notes: >
      TODO(M1+): needs a developer.bestbuy.com key in BESTBUY_API_KEY, and the keyboard
      categoryPath.id confirmed against the live Categories API before this is enabled. The
      list_path above is a placeholder shape, not a verified query.

  - name: ebay
    base_url: "https://api.ebay.com"
    enabled: false
    brand_source: vendor
    fetch:
      mode: api
      list_paths:
        - "/buy/browse/v1/item_summary/search?q={query}&limit={limit}&offset={offset}"
      page_size: 200
      max_pages: 2
      max_rps: 1.0
      respect_robots: true
      auth:
        mode: oauth2_client_credentials
        env_vars: ["EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET"]
    parser: ebay_browse_api
    notes: >
      TODO(M1+): needs an eBay developer app (client credentials -> application token) and the
      keyboard category_id confirmed. Used-condition listings would also need a condition
      filter before the prices are comparable with the new-only retailers above.

