# Shelf category config — mechanical keyboards.
# A category is defined entirely here: its spec schema, its retailers + how to fetch each,
# and a seed product list to bootstrap the catalog. Adding a category = a file like this
# plus parsers; no pipeline code changes (proven in M7 with monitors).
#
# Retailer selection (verified 2026-09-10, see docs/Sessions.md M0 for the full survey):
# every retailer below is fetched from its Shopify storefront's public product JSON, which
# robots.txt permits and which returns price, availability, SKU and variants as structured
# data. HTML-only candidates were evaluated and rejected: zsa.io renders prices client-side,
# nuphy.com and microcenter.com answer bot challenges, drop.com serves no robots.txt, and
# bhphotovideo.com 403s a plain crawler. Best Buy and eBay have real APIs but need
# credentials, so they are present and disabled rather than guessed at.

name: keyboards

# --- spec schema ---------------------------------------------------------------
# Field -> {type, enum?, unit?}. The app validates products.spec against this.
spec_schema:
  switch_type:     { type: string,  enum: [linear, tactile, clicky, silent-linear, silent-tactile, magnetic, topre, optical] }
  hot_swap:        { type: boolean }
  layout_size:     { type: string,  enum: ["full", "1800", "tkl", "75", "65", "60", "40", "alice", "split"] }
  connectivity:    { type: string,  enum: [wired, "2.4ghz", bluetooth, tri-mode] }
  keycap_profile:  { type: string,  enum: [oem, cherry, sa, xda, dsa, mt3, kat] }
  keycap_material: { type: string,  enum: [abs, pbt, unknown] }
  case_material:   { type: string,  enum: [plastic, aluminum, polycarbonate, wood, other] }
  mount_type:      { type: string,  enum: [tray, top, gasket, "o-ring", plate, unknown] }
  key_count:       { type: integer }

# --- entity resolution ---------------------------------------------------------
# What the resolver (M3) needs to know about keyboards that it cannot read off the schema.
resolution:
  # Spec fields every variant of one product shares, so that a listing disagreeing with the catalog
  # on one is a different product. Empty on purpose, after measuring: layout_size was the obvious
  # candidate, but at this seed list's granularity it is a variant attribute — a "GMMK 3" is sold
  # at 65%, 75% and 100% — and switching it on cost four labeled matches and caught nothing
  # (docs/benchmarks/m3-entity-resolution.md). switch_type never qualified: a Q1 Pro ships with
  # linear or tactile switches and is still a Q1 Pro.
  identity_fields: []
  # Title phrases that mean the listing is not a purchasable instance of any product — a bundle, a
  # part, a custom order — so its price must not become the product's. Matched on whole normalized
  # tokens. Chosen narrowly on purpose: "pcb", "kit", "case" and "barebones" all name real keyboard
  # variants on these retailers and would be wrong here.
  non_product_phrases: ["bundle", "combo", "custom order", "with pbtfans", "module", "top case"]

# --- retailers ---------------------------------------------------------------
# `mode: api` = a structured endpoint parsed with Jackson. `mode: html` = a public page parsed
# with Jsoup. list_paths are the ONLY paths fetched for a retailer: the crawler never follows a
# link out of a fetched document. {limit}/{page} are substituted per request.
retailers:
  - name: keychron
    base_url: "https://www.keychron.com"
    brand_source: fixed          # Shopify `vendor` here is a product series ("Q HE series")
    brand: Keychron
    fetch:
      mode: api
      list_paths:
        - "/collections/all-keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2               # ~352 keyboards in this collection
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      Shopify storefront product JSON. robots.txt allows /collections and /products; the
      disallowed paths are cart/checkout/account, which this crawler never requests.

  - name: kbdfans
    base_url: "https://kbdfans.com"
    brand_source: fixed          # `vendor` is "KBDfans", plus a few listings tagged "Third Party"
    brand: KBDfans
    fetch:
      mode: api
      list_paths:
        - "/collections/keyboard-category/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      A handful of listings carry vendor "Third Party" rather than a manufacturer; those keep
      the store brand here and are left for M3 entity resolution to correct from the title.

  - name: mechanicalkeyboards
    base_url: "https://mechanicalkeyboards.com"
    brand_source: vendor         # genuine multi-brand retailer: Ducky, Varmilo, HHKB, Leopold…
    fetch:
      mode: api
      list_paths:
        - "/collections/compact-keyboards-60/products.json?limit={limit}&page={page}"
        - "/collections/75-keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 2
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json
    notes: >
      The cross-retailer anchor: stocks brands that also sell direct (Keychron, Wooting,
      Glorious), which is what makes a price comparison — and M3's resolution eval — meaningful.

  - name: glorious
    base_url: "https://www.gloriousgaming.com"
    brand_source: fixed          # `vendor` is a series ("GMMK 3 Prebuilt")
    brand: Glorious
    fetch:
      mode: api
      list_paths:
        - "/collections/keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json

  - name: epomaker
    base_url: "https://epomaker.com"
    brand_source: vendor         # accurate here: "Epomaker", and "AJAZZ" for the one rebadge
    fetch:
      mode: api
      list_paths:
        - "/collections/keyboards/products.json?limit={limit}&page={page}"
      page_size: 250
      max_pages: 1
      max_rps: 0.2
      respect_robots: true
      auth: { mode: none }
    parser: shopify_products_json

  # --- configured but not yet crawlable ------------------------------------------
  # Both are real APIs with public documentation, disabled until credentials exist. The
  # endpoint/param details are deliberately NOT filled in from memory — see docs/Sessions.md.
  - name: bestbuy
    base_url: "https://api.bestbuy.com"
    enabled: false
    brand_source: vendor
    fetch:
      mode: api
      list_paths:
        - "/v1/products(categoryPath.id={category_path_id})?format=json&pageSize={limit}&page={page}"
      page_size: 100
      max_pages: 2
      max_rps: 1.0
      respect_robots: true
      auth:
        mode: api_key
        env_vars: ["BESTBUY_API_KEY"]
    parser: bestbuy_api
    notes: >
      TODO(M1+): needs a developer.bestbuy.com key in BESTBUY_API_KEY, and the keyboard
      categoryPath.id confirmed against the live Categories API before this is enabled. The
      list_path above is a placeholder shape, not a verified query.

  - name: ebay
    base_url: "https://api.ebay.com"
    enabled: false
    brand_source: vendor
    fetch:
      mode: api
      list_paths:
        - "/buy/browse/v1/item_summary/search?q={query}&limit={limit}&offset={offset}"
      page_size: 200
      max_pages: 2
      max_rps: 1.0
      respect_robots: true
      auth:
        mode: oauth2_client_credentials
        env_vars: ["EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET"]
    parser: ebay_browse_api
    notes: >
      TODO(M1+): needs an eBay developer app (client credentials -> application token) and the
      keyboard category_id confirmed. Used-condition listings would also need a condition
      filter before the prices are comparable with the new-only retailers above.

# --- sentiment -------------------------------------------------------------------
# The category's own verdict words (M9). The sentiment rule's general lexicon — love, great,
# terrible, returned — lives in code; these are the words this hobby uses as praise or complaint
# that mean nothing elsewhere. Matched on whole normalized tokens in the sentence around a mention.
sentiment:
  positive: [creamy, thocky, thock, thocc, marbly, buttery, smooth, crisp, clacky]
  negative: [mushy, pingy, ping, rattly, rattle, hollow, scratchy, spongy, plasticky, wobbly]

# --- communities -----------------------------------------------------------------
# Where people talk about these products (M8, the first v2 section). Same idiom as a retailer: a
# stable name, the platform id, an `ingest` block with credentials by env var NAME, and notes.
# `shelf ingest --category keyboards` reads every enabled entry into raw_mentions and stops there;
# matching mentions to products is M9. A community whose env vars are unset is skipped with a
# warning, so a clone with one platform's credentials ingests what it can.
#
# Both platforms' terms were checked live on 2026-09-17 (docs/Sessions.md, M8), not remembered:
#   Reddit — since 2025-11-11 every Data API client, non-commercial and read-only included, needs
#   a manual access request approved first (100 requests/min per client once approved, no charge).
#   No client is approved yet, so the subreddits are present and disabled, like bestbuy above.
#   YouTube — a plain Data API key reads a channel's uploads (title + description) and top-level
#   comments within a free 10,000-unit daily quota; transcripts are owner-only through the official
#   API and the undocumented route is against the Developer Policies, so they are not read.
#   Stored YouTube data must be refreshed or deleted within 30 days: re-run the ingest inside that.
communities:
  - name: r_mechanicalkeyboards
    source: reddit
    id: MechanicalKeyboards
    enabled: false
    ingest:
      window_days: 30
      max_items: 200
      comments_per_item: 50
      max_rps: 1.0                # Reddit's free tier is 100/min per client; stay under it
      auth:
        mode: oauth2_client_credentials
        env_vars: ["REDDIT_CLIENT_ID", "REDDIT_CLIENT_SECRET"]   # in this order: id, then secret
    notes: >
      TODO(M8+): needs a Reddit Data API client approved under the Responsible Builder Policy
      (developers.reddit.com, "request access"; non-commercial research use). The ingester is
      written to the documented API shape and its fixtures are labeled as unrecorded until then.

  - name: r_keyboards
    source: reddit
    id: keyboards
    enabled: false
    ingest:
      window_days: 30
      max_items: 100
      comments_per_item: 50
      max_rps: 1.0
      auth:
        mode: oauth2_client_credentials
        env_vars: ["REDDIT_CLIENT_ID", "REDDIT_CLIENT_SECRET"]
    notes: The general-audience subreddit; waits on the same Responsible Builder Policy approval.

  - name: yt_hipyo
    source: youtube
    id: "UCXlDgfWY2JbsYEam2m68Hyw"  # Hipyo Tech's channel id, not the @Hipyo handle — see notes
    ingest:
      window_days: 90
      max_items: 50
      comments_per_item: 100
      max_rps: 1.0
      auth:
        mode: api_key
        env_vars: ["YOUTUBE_API_KEY"]
    notes: >
      Hipyo Tech — keyboard reviews and rankings. Was "@Hipyo" until 2026-09-17's first real
      ingest returned 2013 DJ-competition videos: the handle now belongs to an unrelated
      channel. M8's "handle checked 2026-09-17" only confirmed the handle resolved to *a*
      channel (an HTTP 200 on the profile page), never that it was the right one — a live
      check that wasn't actually a check. Pinned to the channel id instead, which a handle
      reassignment cannot change; confirmed via channels.list (title "Hipyo Tech", description
      names keyboards). yt_alexotos / yt_keybored's handles pulled correct, on-topic content on
      the same run and are left as handles.

  - name: yt_alexotos
    source: youtube
    id: "@Alexotos"
    ingest:
      window_days: 90
      max_items: 50
      comments_per_item: 100
      max_rps: 1.0
      auth:
        mode: api_key
        env_vars: ["YOUTUBE_API_KEY"]
    notes: Keyboard reviews; handle checked 2026-09-17.

  - name: yt_keybored
    source: youtube
    id: "@Keybored"
    ingest:
      window_days: 90
      max_items: 50
      comments_per_item: 100
      max_rps: 1.0
      auth:
        mode: api_key
        env_vars: ["YOUTUBE_API_KEY"]
    notes: Keyboard reviews; handle checked 2026-09-17.

# --- seed products ---------------------------------------------------------------
# Bootstraps the catalog and gives entity resolution something to match against. Every entry
# below was taken from a live listing during the M0 retailer survey, not from memory.
# `aliases` (M9) are the other names a product goes by in free text — read by mention resolution
# exactly as the model is; a listing title never needs one. Given only where the everyday name
# differs from the retailer's model string, not tuned to any label.
seed_products:
