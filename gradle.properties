org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is OFF: the Flyway Gradle plugin (11.1.0) calls Task.project at
# execution time, which the configuration cache forbids, so `./gradlew flywayMigrate`
# fails with it enabled. Build times here are seconds either way. Revisit when the
# Flyway plugin supports it, or if migrations move fully behind `shelf migrate`.
org.gradle.configuration-cache=false
