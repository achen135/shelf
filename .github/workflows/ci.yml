# Shelf CI: the build must be green from an empty database on every push.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Postgres for the Flyway step. The JUnit suite does not use this one — Testcontainers
    # starts its own throwaway database so that tests cannot depend on leftover state.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shelf
          POSTGRES_USER: shelf
          POSTGRES_PASSWORD: shelf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shelf -d shelf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SHELF_DB_URL: jdbc:postgresql://localhost:5432/shelf
      SHELF_DB_USER: shelf
      SHELF_DB_PASSWORD: shelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Compile (Error Prone) + SpotBugs + Spotless + JUnit, including the Testcontainers
      # tests — the runner's Docker daemon backs those. This is also where the crawl smoke
      # lives: CrawlRunIntegrationTest drives the real pipeline (robots, fetch, parse, upsert,
      # observe) against the fixture HTTP server and a throwaway Postgres, so a break in the
      # crawl path fails CI without any job here ever touching a live retailer. M2's recovery
      # tests run here too: they launch real `shelf worker` / `shelf coordinator` JVMs from the
      # test classpath and SIGKILL them, so they need nothing the unit tests do not.
      - name: check
        run: ./gradlew --no-daemon check

      - name: recovery numbers
        if: always()
        run: cat build/benchmarks/*.txt || true

      # Proves the migrations apply to a database that has never seen them.
      - name: flyway migrate from an empty database
        run: ./gradlew --no-daemon flywayMigrate flywayInfo

      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/spotbugs

  # The compose demo is a deliverable (M2): prove the image still builds. A separate job so
  # the from-scratch Gradle build inside Docker does not sit on the test job's critical path.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose build worker
      - name: the image runs
        run: docker run --rm shelf:local --version
