name: widgets
spec_schema:
  finish: { type: string }
retailers:
  - name: shop_one
    base_url: "https://shop-one.test"
    fetch:
      mode: api
      list_paths: ["/x.json"]
      max_rps: 0.5
      octopus: true          # not part of the config format
    parser: shopify_products_json
seed_products:
  - { brand: "ShopOne", model: "W1", canonical_name: "ShopOne W1" }
